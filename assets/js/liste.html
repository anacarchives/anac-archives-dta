<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des autorisations - ANAC Archives DTA</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <div class="topbar">
                <div>
                    <div class="page-title">Liste des autorisations</div>
                </div>
            </div>

            <div class="content-wrapper">

                <!-- Filtres -->
                <div class="filters-bar">
                    <div class="filter-group">
                        <label class="filter-label">Recherche</label>
                        <div class="search-input-wrap">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            <input type="text" id="searchInput" class="form-input search-input" placeholder="Numéro, opérateur, immatriculation...">
                        </div>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Type</label>
                        <select id="filterType" class="form-select">
                            <option value="">Tous</option>
                            <option value="SAT">SAT</option>
                            <option value="SUR">SUR</option>
                            <option value="ATT">ATT</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Année</label>
                        <select id="filterYear" class="form-select"><option value="">Toutes</option></select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Statut</label>
                        <select id="filterStatus" class="form-select">
                            <option value="">Tous</option>
                            <option value="en_attente">En attente</option>
                            <option value="approuve">Approuvée</option>
                        </select>
                    </div>
                    <button class="btn btn-secondary" id="btnReset" style="width:auto; padding:10px 16px;">Réinitialiser</button>
                </div>

                <div id="resultsCount" class="results-count"></div>

                <div class="results-table">
                    <table>
                        <thead>
                            <tr>
                                <th>N° Autorisation</th>
                                <th>Type</th>
                                <th>Opérateur</th>
                                <th>Aéronef</th>
                                <th>Immat.</th>
                                <th>Validité</th>
                                <th>Approbation</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="resultsBody">
                            <tr><td colspan="8" style="text-align:center; padding:40px; color:var(--text-muted);">Chargement...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div id="pagination" class="pagination"></div>
            </div>
        </main>
    </div>

    <!-- Modal détail -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal" style="max-width:780px;">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Autorisation</div>
                <button class="modal-close" id="modalClose">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <script type="module">
        import { checkAuth, injectSidebar } from '../assets/js/layout.js';
        import { showToast, formatDate, getStatus, getTypeBadgeClass } from '../assets/js/helpers.js';
        import { getAllAuthorizations, getAuthorization, deleteAuthorization, approveAuthorization, filterAuthorizations } from '../assets/js/database.js';
        import { downloadGeneratedPDF } from '../assets/js/pdf-generator.js';

        injectSidebar('liste');

        let allRecords = [];
        let currentUser = null;
        let currentAuthUser = null;
        let currentPage = 1;
        const PER_PAGE = 20;

        checkAuth(async (user, userData) => {
            currentAuthUser = user;
            currentUser = userData;
            await loadData();
        });

        async function loadData() {
            try {
                allRecords = await getAllAuthorizations({ limit: 1000 });
                // tri par plus récent en premier
                allRecords.sort((a, b) => {
                    const da = a.createdAt?.seconds || 0;
                    const db = b.createdAt?.seconds || 0;
                    return db - da;
                });
                buildYearFilter();
                applyFilters();
            } catch (e) {
                showToast('Erreur: ' + e.message, 'error');
            }
        }

        function buildYearFilter() {
            const years = [...new Set(allRecords.map(r => r.year).filter(Boolean))].sort((a, b) => b - a);
            const sel = document.getElementById('filterYear');
            sel.innerHTML = '<option value="">Toutes</option>' + years.map(y => `<option value="${y}">${y}</option>`).join('');
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const type = document.getElementById('filterType').value;
            const year = document.getElementById('filterYear').value;
            const status = document.getElementById('filterStatus').value;

            let results = allRecords;
            if (search) results = results.filter(r => (r.searchIndex || '').toLowerCase().includes(search));
            if (type) results = results.filter(r => r.typeCode === type);
            if (year) results = results.filter(r => String(r.year) === String(year));
            if (status === 'approuve') results = results.filter(r => r.statut === 'approuve');
            if (status === 'en_attente') results = results.filter(r => r.statut !== 'approuve');

            renderTable(results);
        }

        function renderTable(results) {
            document.getElementById('resultsCount').innerHTML = `<strong>${results.length}</strong> autorisation(s) trouvée(s)`;

            if (results.length === 0) {
                document.getElementById('resultsBody').innerHTML = '<tr><td colspan="8" style="text-align:center; padding:40px; color:var(--text-muted);">Aucune autorisation</td></tr>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const totalPages = Math.ceil(results.length / PER_PAGE);
            if (currentPage > totalPages) currentPage = 1;
            const start = (currentPage - 1) * PER_PAGE;
            const pageResults = results.slice(start, start + PER_PAGE);

            document.getElementById('resultsBody').innerHTML = pageResults.map(a => {
                const statut = a.statut === 'approuve' ? 'approuve' : 'en_attente';
                const label  = a.statut === 'approuve' ? 'Approuvée' : 'En attente';
                const cls    = a.statut === 'approuve' ? 'badge-active' : 'badge-soon';
                return `<tr data-id="${a.id}">
                    <td><strong>${a.numero || '—'}</strong></td>
                    <td><span class="badge ${getTypeBadgeClass(a.typeCode)}">${a.typeCode || '—'}</span></td>
                    <td>${a.operateur || '—'}</td>
                    <td>${a.aeronefType || '—'}</td>
                    <td>${a.immatriculation || '—'}</td>
                    <td>${formatDate(a.dateDebutValidite)} → ${formatDate(a.dateFinValidite)}</td>
                    <td><span class="badge ${cls}">${label}</span></td>
                    <td><button class="btn btn-secondary btn-sm" data-action="view" data-id="${a.id}">Voir</button></td>
                </tr>`;
            }).join('');

            renderPagination(totalPages);

            document.querySelectorAll('[data-action="view"]').forEach(btn => {
                btn.addEventListener('click', () => showDetail(btn.dataset.id));
            });
        }

        function renderPagination(totalPages) {
            const c = document.getElementById('pagination');
            if (totalPages <= 1) { c.innerHTML = ''; return; }
            let html = `<button ${currentPage === 1 ? 'disabled' : ''} data-page="${currentPage - 1}">←</button>`;
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
            }
            html += `<button ${currentPage === totalPages ? 'disabled' : ''} data-page="${currentPage + 1}">→</button>`;
            c.innerHTML = html;
            c.querySelectorAll('button[data-page]').forEach(b => b.addEventListener('click', () => {
                currentPage = parseInt(b.dataset.page);
                applyFilters();
            }));
        }

        // filtres
        document.getElementById('searchInput').addEventListener('input', () => { currentPage = 1; applyFilters(); });
        document.getElementById('filterType').addEventListener('change', () => { currentPage = 1; applyFilters(); });
        document.getElementById('filterYear').addEventListener('change', () => { currentPage = 1; applyFilters(); });
        document.getElementById('filterStatus').addEventListener('change', () => { currentPage = 1; applyFilters(); });
        document.getElementById('btnReset').addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterType').value = '';
            document.getElementById('filterYear').value = '';
            document.getElementById('filterStatus').value = '';
            currentPage = 1;
            applyFilters();
        });

        // ─── MODAL DÉTAIL ─────────────────────────────────────
        async function showDetail(id) {
            const rec = await getAuthorization(id);
            if (!rec) return;

            const valStatus = getStatus(rec.dateDebutValidite, rec.dateFinValidite);
            const approval = rec.statut === 'approuve' ? 'Approuvée' : 'En attente';

            document.getElementById('modalTitle').textContent = rec.numero || 'Autorisation';
            document.getElementById('modalBody').innerHTML = `
                <div class="detail-grid">
                    <div class="detail-item"><div class="detail-label">N° Autorisation</div><div class="detail-value">${rec.numero || '—'}</div></div>
                    <div class="detail-item"><div class="detail-label">Type</div><div class="detail-value"><span class="badge ${getTypeBadgeClass(rec.typeCode)}">${rec.typeCode || '—'}</span> ${rec.type || ''}</div></div>
                    <div class="detail-item"><div class="detail-label">Date émission</div><div class="detail-value">${formatDate(rec.dateEmission)}</div></div>
                    <div class="detail-item"><div class="detail-label">Date réception</div><div class="detail-value">${formatDate(rec.dateReception)}</div></div>
                    <div class="detail-item"><div class="detail-label">Opérateur</div><div class="detail-value">${rec.operateur || '—'}</div></div>
                    <div class="detail-item"><div class="detail-label">Destinataire</div><div class="detail-value">${rec.destinataire || '—'}</div></div>
                    <div class="detail-item"><div class="detail-label">Aéronef</div><div class="detail-value">${rec.aeronefType || '—'}</div></div>
                    <div class="detail-item"><div class="detail-label">Immatriculation</div><div class="detail-value">${rec.immatriculation || '—'}</div></div>
                    <div class="detail-item"><div class="detail-label">Motif</div><div class="detail-value">${rec.motif || '—'}</div></div>
                    <div class="detail-item full"><div class="detail-label">Route</div><div class="detail-value">${rec.route || '—'}</div></div>
                    <div class="detail-item"><div class="detail-label">Date début validité</div><div class="detail-value">${formatDate(rec.dateDebutValidite)}</div></div>
                    <div class="detail-item"><div class="detail-label">Date fin validité</div><div class="detail-value">${formatDate(rec.dateFinValidite)} ${rec.validiteExtension ? `<span class="badge badge-future">${rec.validiteExtension}</span>` : ''}</div></div>
                    <div class="detail-item"><div class="detail-label">Validité</div><div class="detail-value"><span class="badge ${valStatus.class}">${valStatus.label}</span></div></div>
                    <div class="detail-item"><div class="detail-label">Approbation</div><div class="detail-value">${approval}</div></div>
                    <div class="detail-item"><div class="detail-label">Créée par</div><div class="detail-value" style="font-size:13px;">${rec.createdBy || '—'}</div></div>
                    ${rec.approvedBy ? `<div class="detail-item"><div class="detail-label">Approuvée par</div><div class="detail-value" style="font-size:13px;">${rec.approvedBy}</div></div>` : ''}
                </div>
            `;

            let footer = '';
            footer += `<button class="btn btn-secondary" id="btnPrint">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                Imprimer
            </button>`;

            // bouton Approuver pour le directeur
            if (currentUser?.role === 'directeur' && rec.statut !== 'approuve') {
                footer += `<button class="btn btn-success" id="btnApprove" style="width:auto; padding:10px 20px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    Approuver
                </button>`;
            }

            // suppression admin
            if (currentUser?.role === 'admin') {
                footer += `<button class="btn btn-danger" id="btnDelete">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    Supprimer
                </button>`;
            }

            footer += `<button class="btn btn-primary" id="btnCloseDet" style="width:auto; padding:10px 20px;">Fermer</button>`;

            document.getElementById('modalFooter').innerHTML = footer;
            document.getElementById('detailModal').classList.add('show');

            document.getElementById('btnCloseDet').addEventListener('click', closeModal);

            document.getElementById('btnPrint').addEventListener('click', () => {
                try {
                    // si approuvée + signature stockée, on l'inclut
                    const printData = { ...rec };
                    downloadGeneratedPDF(printData);
                    showToast('PDF généré', 'info');
                } catch (e) {
                    showToast('Erreur: ' + e.message, 'error');
                }
            });

            const btnApprove = document.getElementById('btnApprove');
            if (btnApprove) {
                btnApprove.addEventListener('click', async () => {
                    if (!confirm(`Approuver l'autorisation ${rec.numero} ?`)) return;
                    try {
                        const sigKey = `signature_${currentAuthUser.uid}`;
                        const sig = localStorage.getItem(sigKey) || null;
                        if (!sig) {
                            if (!confirm("Vous n'avez pas de signature enregistrée dans Paramètres. Approuver quand même ?")) return;
                        }
                        await approveAuthorization(rec.id, currentAuthUser.uid, currentUser.email || currentUser.identifiant || '', sig);
                        showToast(`Autorisation ${rec.numero} approuvée`, 'success');
                        closeModal();
                        await loadData();
                    } catch (e) {
                        showToast('Erreur: ' + e.message, 'error');
                    }
                });
            }

            const btnDelete = document.getElementById('btnDelete');
            if (btnDelete) {
                btnDelete.addEventListener('click', async () => {
                    if (!confirm(`Supprimer définitivement ${rec.numero} ?`)) return;
                    try {
                        await deleteAuthorization(rec.id);
                        showToast('Autorisation supprimée', 'success');
                        closeModal();
                        await loadData();
                    } catch (e) {
                        showToast('Erreur: ' + e.message, 'error');
                    }
                });
            }
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('show');
        }

        document.getElementById('modalClose').addEventListener('click', closeModal);
    </script>
</body>
</html>
