<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modèles - ANAC Archives DTA</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        .editor-layout {
            display: grid;
            grid-template-columns: 280px 1fr 1fr;
            gap: 16px;
            align-items: start;
            margin-top: 16px;
        }

        /* Panneau gauche — sélection rectangle + textes */
        .rects-panel {
            background: white;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 0;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 16px;
        }
        .rects-panel-header {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-light);
            font-size: 13px;
            font-weight: 700;
            color: var(--primary);
        }

        .rect-button {
            width: 100%;
            text-align: left;
            padding: 12px 16px;
            border: none;
            border-bottom: 1px solid #F5F5F5;
            background: white;
            cursor: pointer;
            transition: background 0.15s;
            font-size: 13px;
        }
        .rect-button:hover { background: var(--bg); }
        .rect-button.active { background: #EFF3FB; border-left: 3px solid var(--primary); padding-left: 13px; }
        .rect-button .rect-name { font-weight: 600; color: var(--text); margin-bottom: 2px; }
        .rect-button .rect-info { font-size: 11px; color: var(--text-muted); }

        /* Liste des textes dans le rectangle sélectionné */
        .texts-list {
            border-top: 1px solid var(--border-light);
            padding: 12px;
            max-height: 280px;
            overflow-y: auto;
        }
        .text-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 4px;
        }
        .text-item:hover { background: var(--bg); }
        .text-item.active { background: #EFF3FB; }
        .text-item-content {
            flex: 1;
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .text-item-delete {
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 16px;
            padding: 2px 6px;
            opacity: 0.5;
        }
        .text-item-delete:hover { opacity: 1; }

        .btn-add-text {
            width: calc(100% - 24px);
            margin: 0 12px 12px;
            padding: 10px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-add-text:hover { background: var(--primary-dark); }

        /* Panneau central — édition du texte sélectionné */
        .edit-panel {
            background: white;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 18px;
            box-shadow: var(--shadow-sm);
        }
        .edit-empty {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-muted);
            font-size: 13px;
        }

        .edit-section { margin-bottom: 16px; }
        .edit-section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-light);
            margin-bottom: 8px;
        }
        .edit-row { display: flex; gap: 10px; }
        .edit-row .form-group { flex: 1; margin: 0; }

        /* Panneau droite — aperçu PDF */
        .preview-panel {
            background: white;
            border: 1px solid var(--border-light);
            border-radius: 12px;
            padding: 12px;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 16px;
        }
        .preview-panel-header {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-light);
            margin-bottom: 10px;
        }
        #pdfPreview {
            width: 100%;
            height: 75vh;
            border: 1px solid var(--border-light);
            border-radius: 6px;
        }

        /* Type tabs */
        .type-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .type-tab {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s;
            color: var(--text-light);
        }
        .type-tab:hover { border-color: var(--primary); color: var(--primary); }
        .type-tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Save bar */
        .save-bar {
            position: fixed;
            bottom: 0; left: 240px; right: 0;
            background: white;
            border-top: 1px solid var(--border-light);
            padding: 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
            z-index: 100;
        }
        .content-wrapper { padding-bottom: 80px; }
    </style>
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <div class="topbar">
                <div>
                    <div class="page-title">Modèles de documents</div>
                    <div class="page-subtitle">Configurez les textes pour chaque type d'autorisation</div>
                </div>
            </div>

            <div class="content-wrapper">

                <!-- Sélecteur de type -->
                <div class="type-tabs" id="typeTabs"></div>

                <div class="editor-layout">

                    <!-- Panneau rectangles + textes -->
                    <div class="rects-panel">
                        <div class="rects-panel-header" id="rectsHeader">Rectangles</div>
                        <div id="rectsList"></div>
                        <div class="texts-list" id="textsList" style="display:none;">
                            <div id="textsItems"></div>
                            <button class="btn-add-text" id="btnAddText">+ Ajouter un texte</button>
                            <button class="btn-add-text" id="btnAddImage" style="margin-top:6px;">+ Ajouter une image</button>
                            <input type="file" id="fileImageInput" accept="image/*" style="display:none;">
                        </div>
                    </div>

                    <!-- Panneau édition -->
                    <div class="edit-panel" id="editPanel">
                        <div class="edit-empty">Sélectionnez un rectangle puis un texte pour le modifier</div>
                    </div>

                    <!-- Panneau aperçu -->
                    <div class="preview-panel">
                        <div class="preview-panel-header">Aperçu PDF</div>
                        <iframe id="pdfPreview"></iframe>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <div class="save-bar">
        <div style="font-size:13px; color:var(--text-light);">Type : <strong id="saveBarType" style="color:var(--primary);">—</strong></div>
        <button class="btn btn-primary" id="btnSaveAll" style="width:auto; padding:10px 24px;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
            Enregistrer le modèle
        </button>
    </div>

    <script type="module">
        import { checkAuth, injectSidebar } from '../assets/js/layout.js';
        import { showToast } from '../assets/js/helpers.js';
        import { db, storage } from '../assets/js/firebase-config.js';
        import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { ref as storageRef, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";
        import { generatePreviewPDF, getPreviewDataURI, clearModelsCache, clearImgCache } from '../assets/js/pdf-gen2.js';

        injectSidebar('modeles');

        let TYPES = []; // chargé depuis Firestore

        async function loadTypes() {
            try {
                const snap = await getDoc(doc(db, 'params', 'types'));
                if (snap.exists() && snap.data().list) {
                    const list = snap.data().list;
                    TYPES = Object.values(list).map(t => ({ code: t.code, label: t.label }));
                }
            } catch (e) { console.error(e); }
            if (TYPES.length === 0) {
                TYPES = [{ code: 'SAT', label: 'Survol et Atterrissage' }];
            }
        }

        // 6 rectangles éditables (R1 maintenant éditable aussi)
        const RECTS = [
            { id: 'R1', label: 'Rectangle 1', info: 'En-tête', defaultHeight: 45 },
            { id: 'R2', label: 'Rectangle 2', info: 'Titre / Numéro / Type', defaultHeight: 34 },
            { id: 'R3', label: 'Rectangle 3', info: 'Info ANAC / Destinataire', defaultHeight: 33 },
            { id: 'R4', label: 'Rectangle 4', info: 'Visa / Aéronef', defaultHeight: 43 },
            { id: 'R5', label: 'Rectangle 5', info: 'Motif / Dates / Conditions', defaultHeight: 0 }, // 0 = auto/restant
            { id: 'R6', label: 'Rectangle 6', info: 'Signature', defaultHeight: 52 },
        ];

        const PAGE_HEIGHT = 297; // A4
        const PAGE_TOP_MARGIN = 3;
        const PAGE_BOTTOM_MARGIN = 3;

        let currentType = 'SAT';
        let currentRect = null;
        let currentTextIdx = null;
        // structure : { SAT: { R2: [{texte, x, y, fontSize, font}, ...], R3: [...], ... }, SUR: {...}, ... }
        let allModels = {};
        let previewTimeout = null;

        checkAuth(async (user, userData) => {
            if (userData.role !== 'admin') {
                showToast('Accès admin uniquement', 'warning');
                setTimeout(() => window.location.href = 'dashboard.html', 1500);
                return;
            }
            await loadTypes();
            await loadModels();
            renderTypeTabs();
            if (TYPES.length > 0) {
                selectType(TYPES[0].code);
            }
            updatePreview();
        });

        async function loadModels() {
            try {
                const snap = await getDoc(doc(db, 'params', 'modeles'));
                if (snap.exists()) allModels = snap.data();
            } catch (e) {}
            TYPES.forEach(t => {
                if (!allModels[t.code]) allModels[t.code] = {};
                if (!allModels[t.code]._heights) allModels[t.code]._heights = {};
                RECTS.forEach(r => {
                    if (!allModels[t.code][r.id]) allModels[t.code][r.id] = [];
                    if (allModels[t.code]._heights[r.id] === undefined) {
                        allModels[t.code]._heights[r.id] = r.defaultHeight;
                    }
                });
            });
        }

        // retourne la hauteur d'un rectangle pour le type courant
        function getRectHeight(typeCode, rectId) {
            const h = allModels[typeCode]?._heights?.[rectId];
            return (h !== undefined) ? h : (RECTS.find(r => r.id === rectId)?.defaultHeight || 0);
        }

        function setRectHeight(typeCode, rectId, value) {
            if (!allModels[typeCode]._heights) allModels[typeCode]._heights = {};
            allModels[typeCode]._heights[rectId] = value;
        }

        // calcule la hauteur effective de R5 (auto = page - autres rectangles)
        function getR5EffectiveHeight(typeCode) {
            const total = PAGE_HEIGHT - PAGE_TOP_MARGIN - PAGE_BOTTOM_MARGIN;
            let used = 0;
            RECTS.forEach(r => {
                if (r.id !== 'R5') used += getRectHeight(typeCode, r.id);
            });
            return Math.max(10, total - used); // minimum 10mm
        }

        async function saveModels() {
            try {
                await setDoc(doc(db, 'params', 'modeles'), allModels);
                showToast('Modèle enregistré', 'success');
            } catch (e) {
                showToast('Erreur: ' + e.message, 'error');
            }
        }

        function renderTypeTabs() {
            document.getElementById('typeTabs').innerHTML = TYPES.map(t => `
                <button class="type-tab ${t.code === currentType ? 'active' : ''}" data-type="${t.code}">
                    ${t.code} — ${t.label}
                </button>
            `).join('');
            document.querySelectorAll('.type-tab').forEach(b => {
                b.addEventListener('click', () => selectType(b.dataset.type));
            });
        }

        function selectType(code) {
            currentType = code;
            currentRect = null;
            currentTextIdx = null;
            document.querySelectorAll('.type-tab').forEach(b => b.classList.toggle('active', b.dataset.type === code));
            const t = TYPES.find(x => x.code === code);
            document.getElementById('saveBarType').textContent = `${code} — ${t?.label || ''}`;
            renderRectsList();
            document.getElementById('textsList').style.display = 'none';
            showEmptyEditor();
            updatePreview();
        }

        function renderRectsList() {
            document.getElementById('rectsList').innerHTML = RECTS.map(r => {
                const items = allModels[currentType][r.id] || [];
                const count = items.length;
                const h = r.id === 'R5' ? getR5EffectiveHeight(currentType) : getRectHeight(currentType, r.id);
                const heightLabel = r.id === 'R5'
                    ? `${h.toFixed(0)}mm (auto)`
                    : `${h.toFixed(0)}mm`;
                return `
                    <button class="rect-button ${r.id === currentRect ? 'active' : ''}" data-rect="${r.id}">
                        <div class="rect-name">${r.label} <span style="font-size:11px; color:var(--text-muted); font-weight:400;">— ${heightLabel}</span></div>
                        <div class="rect-info">${r.info} — ${count} élément${count > 1 ? 's' : ''}</div>
                    </button>
                `;
            }).join('');
            document.querySelectorAll('.rect-button').forEach(b => {
                b.addEventListener('click', () => selectRect(b.dataset.rect));
            });
        }

        function selectRect(rectId) {
            currentRect = rectId;
            currentTextIdx = null;
            renderRectsList();
            renderTextsList();
            document.getElementById('textsList').style.display = 'block';
            showRectEditor();
        }

        // Affiche un éditeur pour la hauteur du rectangle (quand aucun texte sélectionné)
        function showRectEditor() {
            if (!currentRect) { showEmptyEditor(); return; }
            const r = RECTS.find(x => x.id === currentRect);
            const isR5 = currentRect === 'R5';
            const h = isR5 ? getR5EffectiveHeight(currentType) : getRectHeight(currentType, currentRect);

            document.getElementById('editPanel').innerHTML = `
                <div style="font-size:14px; font-weight:700; color:var(--primary); margin-bottom:14px;">
                    ${r.label} — ${r.info}
                </div>

                <div class="edit-section">
                    <div class="edit-section-title">Hauteur du rectangle</div>
                    ${isR5
                        ? `<div style="font-size:13px; padding:10px; background:#FFF3E0; border-radius:6px; color:#E65100;">
                              R5 s'ajuste automatiquement à la place restante : <strong>${h.toFixed(1)} mm</strong>.
                              Modifiez les hauteurs des autres rectangles pour changer celle-ci.
                           </div>`
                        : `<div class="form-group">
                              <label class="form-label">Hauteur (mm)</label>
                              <input type="number" id="eRectHeight" class="form-input" value="${h}" min="5" max="280" step="1">
                              <div style="font-size:11px; color:var(--text-muted); margin-top:6px;">
                                  R5 (zone restante) sera automatiquement ajustée. Total page = 297mm.
                              </div>
                           </div>`
                    }
                </div>

                <div class="edit-section">
                    <div style="font-size:12px; color:var(--text-muted); padding:10px; background:#F5F7FA; border-radius:6px;">
                        Sélectionnez un texte ou une image dans la liste pour le modifier, ou utilisez les boutons "+ Ajouter" pour ajouter du contenu à ce rectangle.
                    </div>
                </div>
            `;

            const inp = document.getElementById('eRectHeight');
            if (inp) {
                inp.addEventListener('input', () => {
                    const v = parseFloat(inp.value);
                    if (isNaN(v) || v < 5) return;
                    // vérifier que ça ne fait pas déborder
                    const total = PAGE_HEIGHT - PAGE_TOP_MARGIN - PAGE_BOTTOM_MARGIN;
                    let other = 0;
                    RECTS.forEach(rr => {
                        if (rr.id !== currentRect && rr.id !== 'R5') other += getRectHeight(currentType, rr.id);
                    });
                    if (v + other > total - 10) {
                        showToast('Hauteur trop grande, R5 doit garder au moins 10mm', 'warning');
                        return;
                    }
                    setRectHeight(currentType, currentRect, v);
                    renderRectsList();
                    queuePreview();
                });
            }
        }

        function renderTextsList() {
            const texts = allModels[currentType][currentRect] || [];
            document.getElementById('textsItems').innerHTML = texts.length === 0
                ? '<div style="text-align:center; padding:14px; color:var(--text-muted); font-size:12px;">Aucun élément. Cliquez "+ Ajouter".</div>'
                : texts.map((t, i) => {
                    const isImg = t.kind === 'image';
                    const label = isImg
                        ? `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle; margin-right:4px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg> Image`
                        : (t.texte || '(vide)');
                    return `
                        <div class="text-item ${i === currentTextIdx ? 'active' : ''}" data-idx="${i}">
                            <div class="text-item-content">${label}</div>
                            <button class="text-item-delete" data-idx="${i}">×</button>
                        </div>
                    `;
                }).join('');

            document.querySelectorAll('.text-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (e.target.classList.contains('text-item-delete')) return;
                    selectText(parseInt(el.dataset.idx));
                });
            });
            document.querySelectorAll('.text-item-delete').forEach(b => {
                b.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteText(parseInt(b.dataset.idx));
                });
            });
        }

        function selectText(idx) {
            currentTextIdx = idx;
            renderTextsList();
            renderEditPanel();
        }

        function renderEditPanel() {
            if (currentTextIdx === null) { showEmptyEditor(); return; }
            const t = allModels[currentType][currentRect][currentTextIdx];
            const isImage = t.kind === 'image';

            if (isImage) {
                document.getElementById('editPanel').innerHTML = `
                    <div style="font-size:14px; font-weight:700; color:var(--primary); margin-bottom:14px;">
                        ${currentRect} — Image #${currentTextIdx + 1}
                    </div>

                    <div class="edit-section">
                        <div class="edit-section-title">Image</div>
                        <div style="background:#F8F9FB; border:1px dashed var(--border); border-radius:6px; padding:10px; text-align:center; margin-bottom:10px;">
                            ${(t.url || t.dataUrl) ? `<img src="${t.url || t.dataUrl}" style="max-width:100%; max-height:120px;">` : '<div style="color:var(--text-muted); font-size:12px;">Aucune image</div>'}
                        </div>
                        <button class="btn-add-text" id="btnReplaceImage" style="margin:0;">Remplacer l'image</button>
                    </div>

                    <div class="edit-section">
                        <div class="edit-section-title">Taille (mm)</div>
                        <div class="edit-row">
                            <div class="form-group">
                                <label class="form-label">Largeur</label>
                                <input type="number" id="eWidth" class="form-input" value="${t.width || 30}" step="0.5" min="1">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Hauteur</label>
                                <input type="number" id="eHeight" class="form-input" value="${t.height || 30}" step="0.5" min="1">
                            </div>
                        </div>
                    </div>

                    <div class="edit-section">
                        <div class="edit-section-title">Apparence</div>
                        <div class="form-group">
                            <label class="form-label">Opacité (0 à 1) — <span id="opVal">${(t.opacity ?? 1).toFixed(2)}</span></label>
                            <input type="range" id="eOpacity" min="0.05" max="1" step="0.05" value="${t.opacity ?? 1}" style="width:100%;">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Thème</label>
                            <select id="eImgTheme" class="form-select">
                                <option value="normal" ${(t.theme || 'normal') === 'normal' ? 'selected' : ''}>Normal (couleurs originales)</option>
                                <option value="grayscale" ${t.theme === 'grayscale' ? 'selected' : ''}>Noir & blanc</option>
                                <option value="watermark" ${t.theme === 'watermark' ? 'selected' : ''}>Filigrane (très clair)</option>
                            </select>
                        </div>
                    </div>

                    <div class="edit-section">
                        <div class="edit-section-title">Position (mm depuis coin haut-gauche du rectangle)</div>
                        <div class="edit-row">
                            <div class="form-group">
                                <label class="form-label">X (mm)</label>
                                <input type="number" id="eX" class="form-input" value="${t.x || 0}" step="0.5">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Y (mm)</label>
                                <input type="number" id="eY" class="form-input" value="${t.y || 0}" step="0.5">
                            </div>
                        </div>
                    </div>
                `;

                ['eWidth', 'eHeight', 'eOpacity', 'eImgTheme', 'eX', 'eY'].forEach(id => {
                    const el = document.getElementById(id);
                    if (!el) return;
                    el.addEventListener('input', applyEdit);
                    el.addEventListener('change', applyEdit);
                });

                document.getElementById('eOpacity').addEventListener('input', (e) => {
                    document.getElementById('opVal').textContent = parseFloat(e.target.value).toFixed(2);
                });

                document.getElementById('btnReplaceImage').addEventListener('click', () => {
                    const inp = document.getElementById('fileImageInput');
                    inp.dataset.replaceIdx = currentTextIdx;
                    inp.click();
                });

                return;
            }

            // texte normal
            document.getElementById('editPanel').innerHTML = `
                <div style="font-size:14px; font-weight:700; color:var(--primary); margin-bottom:14px;">
                    ${currentRect} — Texte #${currentTextIdx + 1}
                </div>

                <div class="edit-section">
                    <div class="edit-section-title">Texte</div>
                    <textarea id="eTexte" class="form-input" rows="4" style="width:100%; resize:vertical;">${t.texte || ''}</textarea>
                </div>

                <div class="edit-section">
                    <div class="edit-section-title">Typographie</div>
                    <div class="edit-row">
                        <div class="form-group">
                            <label class="form-label">Taille (pt)</label>
                            <input type="number" id="eFontSize" class="form-input" value="${t.fontSize || 8}" min="5" max="30" step="0.5">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Police</label>
                            <select id="eFontFamily" class="form-select">
                                <option value="helvetica" ${(t.fontFamily || 'helvetica') === 'helvetica' ? 'selected' : ''}>Helvetica (Sans-serif)</option>
                                <option value="times" ${(t.fontFamily) === 'times' ? 'selected' : ''}>Times (Serif)</option>
                                <option value="courier" ${(t.fontFamily) === 'courier' ? 'selected' : ''}>Courier (Monospace)</option>
                                <option value="cinzel" ${(t.fontFamily) === 'cinzel' ? 'selected' : ''}>Cinzel (Décoratif romain)</option>
                            </select>
                        </div>
                    </div>
                    <div style="display:flex; gap:16px; margin-top:8px;">
                        <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px;">
                            <input type="checkbox" id="eBold" ${getBold(t) ? 'checked' : ''}> Gras
                        </label>
                        <label style="display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px;">
                            <input type="checkbox" id="eItalic" ${getItalic(t) ? 'checked' : ''}> Italique
                        </label>
                    </div>
                </div>

                <div class="edit-section">
                    <div class="edit-section-title">Position (mm depuis coin haut-gauche du rectangle)</div>
                    <div class="edit-row">
                        <div class="form-group">
                            <label class="form-label">X (mm)</label>
                            <input type="number" id="eX" class="form-input" value="${t.x || 0}" step="0.5">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Y (mm)</label>
                            <input type="number" id="eY" class="form-input" value="${t.y || 0}" step="0.5">
                        </div>
                    </div>
                    <div class="form-group" style="margin-top:10px;">
                        <label class="form-label">Largeur max (mm) — vide = largeur du rectangle</label>
                        <input type="number" id="eMaxWidth" class="form-input" value="${t.maxWidth || ''}" step="1" min="5" placeholder="ex: 50">
                        <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">
                            Si le texte dépasse cette largeur, il passe automatiquement à la ligne suivante.
                        </div>
                    </div>
                </div>
            `;

            // appliquer en temps réel
            ['eTexte', 'eFontSize', 'eFontFamily', 'eBold', 'eItalic', 'eX', 'eY', 'eMaxWidth'].forEach(id => {
                const el = document.getElementById(id);
                if (!el) return;
                el.addEventListener('input', applyEdit);
                el.addEventListener('change', applyEdit);
            });
        }

        // helpers pour décomposer/recomposer le style police
        function getBold(t)   { return (t.font || 'bold').includes('bold'); }
        function getItalic(t) { return (t.font || 'bold').includes('italic'); }
        function buildFontStyle(bold, italic) {
            if (bold && italic) return 'bolditalic';
            if (bold) return 'bold';
            if (italic) return 'italic';
            return 'normal';
        }

        function applyEdit() {
            if (currentTextIdx === null) return;
            const t = allModels[currentType][currentRect][currentTextIdx];

            if (t.kind === 'image') {
                t.x        = parseFloat(document.getElementById('eX').value) || 0;
                t.y        = parseFloat(document.getElementById('eY').value) || 0;
                t.width    = parseFloat(document.getElementById('eWidth').value) || 30;
                t.height   = parseFloat(document.getElementById('eHeight').value) || 30;
                t.opacity  = parseFloat(document.getElementById('eOpacity').value) || 1;
                t.theme    = document.getElementById('eImgTheme').value || 'normal';
            } else {
                t.texte    = document.getElementById('eTexte').value;
                t.fontSize = parseFloat(document.getElementById('eFontSize').value) || 8;
                t.fontFamily = document.getElementById('eFontFamily').value || 'helvetica';
                const bold   = document.getElementById('eBold').checked;
                const italic = document.getElementById('eItalic').checked;
                t.font     = buildFontStyle(bold, italic);
                t.x        = parseFloat(document.getElementById('eX').value) || 0;
                t.y        = parseFloat(document.getElementById('eY').value) || 0;
                const mw   = parseFloat(document.getElementById('eMaxWidth').value);
                if (!isNaN(mw) && mw > 0) {
                    t.maxWidth = mw;
                } else {
                    delete t.maxWidth;
                }
            }
            renderTextsList();
            queuePreview();
        }

        function showEmptyEditor() {
            if (currentRect) {
                showRectEditor();
            } else {
                document.getElementById('editPanel').innerHTML = '<div class="edit-empty">Sélectionnez un rectangle pour commencer</div>';
            }
        }

        document.getElementById('btnAddText').addEventListener('click', () => {
            const newText = { texte: 'Nouveau texte', x: 3, y: 5, fontSize: 8, font: 'bold', fontFamily: 'helvetica' };
            allModels[currentType][currentRect].push(newText);
            const newIdx = allModels[currentType][currentRect].length - 1;
            renderRectsList();
            renderTextsList();
            selectText(newIdx);
            queuePreview();
        });

        // ── AJOUTER UNE IMAGE ──
        document.getElementById('btnAddImage').addEventListener('click', () => {
            const inp = document.getElementById('fileImageInput');
            inp.dataset.replaceIdx = ''; // mode ajout (pas remplacement)
            inp.click();
        });

        document.getElementById('fileImageInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // limite 5MB raisonnable
            if (file.size > 5 * 1024 * 1024) {
                showToast('Image trop grosse (max 5 MB)', 'warning');
                e.target.value = '';
                return;
            }

            try {
                showToast('Upload en cours...', 'info');
                const replaceIdx = e.target.dataset.replaceIdx;

                // upload vers Firebase Storage
                const ext = (file.name.split('.').pop() || 'png').toLowerCase();
                const fileName = `models/${currentType}/${currentRect}_${Date.now()}.${ext}`;
                const ref = storageRef(storage, fileName);
                await uploadBytes(ref, file);
                const url = await getDownloadURL(ref);
                clearModelsCache();
                clearImgCache(); // vider le cache images pour forcer rechargement

                if (replaceIdx !== '' && replaceIdx !== undefined) {
                    // remplacement de l'image existante
                    const idx = parseInt(replaceIdx);
                    const item = allModels[currentType][currentRect][idx];
                    // supprimer l'ancienne si c'était dans Storage
                    if (item.storagePath) {
                        try { await deleteObject(storageRef(storage, item.storagePath)); } catch (e) {}
                    }
                    item.url = url;
                    item.storagePath = fileName;
                    delete item.dataUrl; // nettoyer l'ancien base64 si présent
                    selectText(idx);
                } else {
                    const newImage = {
                        kind: 'image',
                        url: url,
                        storagePath: fileName,
                        x: 5,
                        y: 5,
                        width: 30,
                        height: 30,
                        opacity: 1,
                        theme: 'normal'
                    };
                    allModels[currentType][currentRect].push(newImage);
                    const newIdx = allModels[currentType][currentRect].length - 1;
                    renderRectsList();
                    renderTextsList();
                    selectText(newIdx);
                }
                queuePreview();
                showToast('Image téléversée', 'success');
            } catch (err) {
                console.error(err);
                if (err.code === 'storage/unauthorized' || err.message.includes('CORS')) {
                    showToast('Storage non activé. Activez Blaze + Storage dans Firebase.', 'error');
                } else {
                    showToast('Erreur: ' + err.message, 'error');
                }
            }

            e.target.value = '';
        });

        async function deleteText(idx) {
            const item = allModels[currentType][currentRect][idx];
            const isImg = item.kind === 'image';
            if (!confirm(isImg ? 'Supprimer cette image ?' : 'Supprimer ce texte ?')) return;

            // si c'est une image dans Storage, la supprimer
            if (isImg && item.storagePath) {
                try {
                    await deleteObject(storageRef(storage, item.storagePath));
                } catch (e) {
                    console.warn('Suppression Storage:', e);
                }
            }

            allModels[currentType][currentRect].splice(idx, 1);
            if (currentTextIdx === idx) {
                currentTextIdx = null;
                showEmptyEditor();
            } else if (currentTextIdx > idx) {
                currentTextIdx--;
            }
            renderRectsList();
            renderTextsList();
            queuePreview();
        }

        // Aperçu PDF en temps réel (debounced)
        function queuePreview() {
            clearTimeout(previewTimeout);
            previewTimeout = setTimeout(updatePreview, 400);
        }

        async function updatePreview() {
            try {
                const dataUri = await getPreviewDataURI(currentType, allModels[currentType]);
                document.getElementById('pdfPreview').src = dataUri;
            } catch (e) {
                console.error('Aperçu:', e);
            }
        }

        document.getElementById('btnSaveAll').addEventListener('click', saveModels);
    </script>
</body>
</html>
