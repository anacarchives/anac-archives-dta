<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des autorisations - ANAC Archives DTA</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        /* barre de filtres compacte en haut */
        .compact-filters {
            display: flex;
            gap: 10px;
            align-items: center;
            background: white;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1px solid var(--border-light);
            margin-bottom: 18px;
            box-shadow: var(--shadow-sm);
        }
        .compact-filters .search-wrap {
            position: relative;
            flex: 1;
            max-width: 320px;
        }
        .compact-filters .search-wrap svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            pointer-events: none;
        }
        .compact-filters .search-wrap input {
            padding-left: 36px;
            height: 38px;
        }
        .compact-filters select {
            height: 38px;
            padding: 0 12px;
            min-width: 130px;
        }
        .compact-filters .reset-btn {
            margin-left: auto;
            font-size: 13px;
            color: var(--text-light);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px 12px;
        }
        .compact-filters .reset-btn:hover { color: var(--primary); }

        /* tableau plus aéré */
        .liste-table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-light);
        }
        .liste-table table { width: 100%; border-collapse: collapse; }
        .liste-table thead { background: #FAFBFC; }
        .liste-table th {
            padding: 16px 20px;
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: var(--text-light);
            border-bottom: 1px solid var(--border-light);
        }
        .liste-table td {
            padding: 18px 20px;
            font-size: 14px;
            border-bottom: 1px solid #F0F2F5;
            vertical-align: middle;
        }
        .liste-table tbody tr {
            transition: background 0.15s;
        }
        .liste-table tbody tr:hover { background: #FAFBFC; }
        .liste-table tbody tr:last-child td { border-bottom: none; }

        .compteur {
            font-size: 13px;
            color: var(--text-light);
            margin-bottom: 14px;
            margin-left: 4px;
        }
        .compteur strong { color: var(--primary); font-size: 15px; }
    </style>
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <div class="topbar">
                <div>
                    <div class="page-title">Liste des autorisations</div>
                </div>
            </div>

            <div class="content-wrapper">

                <!-- barre filtres compacte -->
                <div class="compact-filters">
                    <div class="search-wrap">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        <input type="text" id="searchInput" class="form-input" placeholder="Rechercher...">
                    </div>
                    <select id="filterType" class="form-select">
                        <option value="">Tous types</option>
                    </select>
                    <select id="filterYear" class="form-select"><option value="">Toutes années</option></select>
                    <select id="filterStatus" class="form-select">
                        <option value="">Tous statuts</option>
                        <option value="en_attente">En attente</option>
                        <option value="approuve">Approuvées</option>
                    </select>
                    <button class="reset-btn" id="btnReset">Réinitialiser</button>
                </div>

                <div id="resultsCount" class="compteur"></div>

                <div class="liste-table">
                    <table>
                        <thead>
                            <tr id="tableHead">
                                <th>N° Autorisation</th>
                                <th>Type</th>
                                <th>Approbation</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="resultsBody">
                            <tr><td colspan="4" style="text-align:center; padding:60px; color:var(--text-muted);">Chargement...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div id="pagination" class="pagination"></div>
            </div>
        </main>
    </div>

    <!-- Modal détail -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal" style="max-width:780px;">
            <div class="modal-header">
                <div class="modal-title" id="modalTitle">Autorisation</div>
                <button class="modal-close" id="modalClose">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <script type="module">
        import { checkAuth, injectSidebar } from '../assets/js/layout.js';
        import { showToast, formatDate, getStatus, getTypeBadgeClass } from '../assets/js/helpers.js';
        import { getAllAuthorizations, getAuthorization, deleteAuthorization, approveAuthorization } from '../assets/js/database.js';
        import { downloadGeneratedPDF } from '../assets/js/pdf-gen.js';
        import { db } from '../assets/js/firebase-config.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        injectSidebar('liste');

        let allRecords = [];
        let currentUser = null;
        let currentAuthUser = null;
        let currentPage = 1;
        const PER_PAGE = 20;
        let listColumns = []; // ids des champs à afficher comme colonnes

        checkAuth(async (user, userData) => {
            currentAuthUser = user;
            currentUser = userData;
            await loadTypeFilter();
            await loadChamps();
            await loadData();
        });

        async function loadTypeFilter() {
            try {
                const snap = await getDoc(doc(db, 'params', 'types'));
                if (snap.exists() && snap.data().list) {
                    const list = snap.data().list;
                    const sel = document.getElementById('filterType');
                    Object.values(list).forEach(t => {
                        const opt = document.createElement('option');
                        opt.value = t.code;
                        opt.textContent = t.code;
                        sel.appendChild(opt);
                    });
                }
            } catch (e) {}
        }

        async function loadData() {
            try {
                allRecords = await getAllAuthorizations({ limit: 1000 });
                // tri par plus récent
                allRecords.sort((a, b) => {
                    const da = a.createdAt?.seconds || 0;
                    const db = b.createdAt?.seconds || 0;
                    return db - da;
                });
                buildYearFilter();
                applyFilters();
            } catch (e) {
                console.error('Erreur load:', e);
                showToast('Erreur: ' + e.message, 'error');
            }
        }

        function buildYearFilter() {
            const years = [...new Set(allRecords.map(r => r.year).filter(Boolean))].sort((a, b) => b - a);
            const sel = document.getElementById('filterYear');
            sel.innerHTML = '<option value="">Toutes années</option>' + years.map(y => `<option value="${y}">${y}</option>`).join('');
        }

        function applyFilters() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const type = document.getElementById('filterType').value;
            const year = document.getElementById('filterYear').value;
            const status = document.getElementById('filterStatus').value;

            // l'archive prend les approuvées — la liste montre tout par défaut
            // mais si on filtre sur "approuvées", on les voit ici aussi
            let results = allRecords;
            if (search) results = results.filter(r => (r.searchIndex || '').toLowerCase().includes(search));
            if (type) results = results.filter(r => r.typeCode === type);
            if (year) results = results.filter(r => String(r.year) === String(year));
            if (status === 'approuve') results = results.filter(r => r.statut === 'approuve');
            if (status === 'en_attente') results = results.filter(r => r.statut !== 'approuve');

            renderTable(results);
        }

        function renderTable(results) {
            document.getElementById('resultsCount').innerHTML = `<strong>${results.length}</strong> autorisation(s)`;

            // construire les en-têtes dynamiquement avec les colonnes choisies
            const customCols = listColumns
                .map(id => CHAMPS[id])
                .filter(c => c)
                .sort((a, b) => (a.order || 0) - (b.order || 0));

            const totalCols = 3 + customCols.length + 1; // numero + type + custom + approbation + voir
            const head = document.getElementById('tableHead');
            head.innerHTML = `
                <th>N° Autorisation</th>
                <th>Type</th>
                ${customCols.map(c => `<th>${c.name}</th>`).join('')}
                <th>Approbation</th>
                <th></th>
            `;

            if (results.length === 0) {
                document.getElementById('resultsBody').innerHTML = `<tr><td colspan="${totalCols}" style="text-align:center; padding:60px; color:var(--text-muted);">Aucune autorisation</td></tr>`;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const totalPages = Math.ceil(results.length / PER_PAGE);
            if (currentPage > totalPages) currentPage = 1;
            const start = (currentPage - 1) * PER_PAGE;
            const pageResults = results.slice(start, start + PER_PAGE);

            document.getElementById('resultsBody').innerHTML = pageResults.map(a => {
                const label = a.statut === 'approuve' ? 'Approuvée' : 'En attente';
                const cls   = a.statut === 'approuve' ? 'badge-active' : 'badge-soon';
                const customCells = customCols.map(c => {
                    const val = a[c.id];
                    const display = (val === undefined || val === null || val === '') ? '—' : val;
                    return `<td>${display}</td>`;
                }).join('');
                return `<tr data-id="${a.id}">
                    <td><strong>${a.numero || '—'}</strong></td>
                    <td><span class="badge ${getTypeBadgeClass(a.typeCode)}">${a.typeCode || '—'}</span></td>
                    ${customCells}
                    <td><span class="badge ${cls}">${label}</span></td>
                    <td><button class="btn btn-secondary btn-sm" data-action="view" data-id="${a.id}">Voir</button></td>
                </tr>`;
            }).join('');

            renderPagination(totalPages);

            document.querySelectorAll('[data-action="view"]').forEach(btn => {
                btn.addEventListener('click', () => showDetail(btn.dataset.id));
            });
        }

        function renderPagination(totalPages) {
            const c = document.getElementById('pagination');
            if (totalPages <= 1) { c.innerHTML = ''; return; }
            let html = `<button ${currentPage === 1 ? 'disabled' : ''} data-page="${currentPage - 1}">←</button>`;
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
            }
            html += `<button ${currentPage === totalPages ? 'disabled' : ''} data-page="${currentPage + 1}">→</button>`;
            c.innerHTML = html;
            c.querySelectorAll('button[data-page]').forEach(b => b.addEventListener('click', () => {
                currentPage = parseInt(b.dataset.page);
                applyFilters();
            }));
        }

        // events filtres
        document.getElementById('searchInput').addEventListener('input', () => { currentPage = 1; applyFilters(); });
        document.getElementById('filterType').addEventListener('change', () => { currentPage = 1; applyFilters(); });
        document.getElementById('filterYear').addEventListener('change', () => { currentPage = 1; applyFilters(); });
        document.getElementById('filterStatus').addEventListener('change', () => { currentPage = 1; applyFilters(); });
        document.getElementById('btnReset').addEventListener('click', () => {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterType').value = '';
            document.getElementById('filterYear').value = '';
            document.getElementById('filterStatus').value = '';
            currentPage = 1;
            applyFilters();
        });

        // ─── MODAL ─────────────────────────────────────────────
        let CHAMPS = {};

        async function loadChamps() {
            try {
                const snap = await getDoc(doc(db, 'params', 'champs'));
                if (snap.exists()) {
                    const data = snap.data();
                    CHAMPS = data.list || {};
                    listColumns = data.listColumns || [];
                }
            } catch (e) {}
        }

        async function showDetail(id) {
            const rec = await getAuthorization(id);
            if (!rec) return;
            if (Object.keys(CHAMPS).length === 0) await loadChamps();

            const approval = rec.statut === 'approuve' ? 'Approuvée' : 'En attente';

            document.getElementById('modalTitle').textContent = rec.numero || 'Autorisation';

            // construire la liste des champs à afficher
            // d'abord type, puis les champs personnalisés dans l'ordre, puis les méta
            let detailHtml = `
                <div class="detail-grid">
                    <div class="detail-item">
                        <div class="detail-label">N° Autorisation</div>
                        <div class="detail-value">${rec.numero || '—'}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Type</div>
                        <div class="detail-value"><span class="badge ${getTypeBadgeClass(rec.typeCode)}">${rec.typeCode || '—'}</span> ${rec.type || ''}</div>
                    </div>
            `;

            // champs personnalisés visibles pour ce type, dans l'ordre
            const customFields = Object.values(CHAMPS)
                .filter(c => c.scope === 'global' || (c.types || []).includes(rec.typeCode))
                .sort((a, b) => (a.order || 0) - (b.order || 0));

            for (const f of customFields) {
                const val = rec[f.id];
                const display = (val === undefined || val === null || val === '') ? '—' : val;
                const fullClass = f.type === 'textarea' ? 'full' : '';
                detailHtml += `
                    <div class="detail-item ${fullClass}">
                        <div class="detail-label">${f.name}</div>
                        <div class="detail-value">${display}</div>
                    </div>
                `;
            }

            // méta (approbation, créé par)
            detailHtml += `
                    <div class="detail-item">
                        <div class="detail-label">Approbation</div>
                        <div class="detail-value">${approval}</div>
                    </div>
                    <div class="detail-item">
                        <div class="detail-label">Créée par</div>
                        <div class="detail-value" style="font-size:13px;">${rec.createdBy || '—'}</div>
                    </div>
                    ${rec.approvedBy ? `<div class="detail-item"><div class="detail-label">Approuvée par</div><div class="detail-value" style="font-size:13px;">${rec.approvedBy}</div></div>` : ''}
                </div>
            `;

            document.getElementById('modalBody').innerHTML = detailHtml;

            let footer = '';
            footer += `<button class="btn btn-secondary" id="btnPrint">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                Imprimer
            </button>`;

            if (currentUser?.role === 'directeur' && rec.statut !== 'approuve') {
                footer += `<button class="btn btn-success" id="btnApprove" style="width:auto; padding:10px 20px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                    Approuver
                </button>`;
            }

            if (currentUser?.role === 'admin') {
                footer += `<button class="btn btn-danger" id="btnDelete">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    Supprimer
                </button>`;
            }

            footer += `<button class="btn btn-primary" id="btnCloseDet" style="width:auto; padding:10px 20px;">Fermer</button>`;

            document.getElementById('modalFooter').innerHTML = footer;
            document.getElementById('detailModal').classList.add('show');

            document.getElementById('btnCloseDet').addEventListener('click', closeModal);

            document.getElementById('btnPrint').addEventListener('click', () => {
                try {
                    downloadGeneratedPDF(rec);
                    showToast('PDF généré', 'info');
                } catch (e) {
                    showToast('Erreur: ' + e.message, 'error');
                }
            });

            const btnApprove = document.getElementById('btnApprove');
            if (btnApprove) {
                btnApprove.addEventListener('click', async () => {
                    if (!confirm(`Approuver l'autorisation ${rec.numero} ?`)) return;
                    try {
                        const sigKey = `signature_${currentAuthUser.uid}`;
                        const sig = localStorage.getItem(sigKey) || null;
                        if (!sig) {
                            if (!confirm("Vous n'avez pas de signature enregistrée dans Paramètres. Approuver quand même ?")) return;
                        }
                        await approveAuthorization(rec.id, currentAuthUser.uid, currentUser.email || currentUser.identifiant || '', sig);
                        showToast(`Autorisation ${rec.numero} approuvée`, 'success');
                        closeModal();
                        await loadData();
                    } catch (e) {
                        showToast('Erreur: ' + e.message, 'error');
                    }
                });
            }

            const btnDelete = document.getElementById('btnDelete');
            if (btnDelete) {
                btnDelete.addEventListener('click', async () => {
                    if (!confirm(`Supprimer définitivement ${rec.numero} ?`)) return;
                    try {
                        await deleteAuthorization(rec.id);
                        showToast('Autorisation supprimée', 'success');
                        closeModal();
                        await loadData();
                    } catch (e) {
                        showToast('Erreur: ' + e.message, 'error');
                    }
                });
            }
        }

        function closeModal() {
            document.getElementById('detailModal').classList.remove('show');
        }

        document.getElementById('modalClose').addEventListener('click', closeModal);
    </script>
</body>
</html>
