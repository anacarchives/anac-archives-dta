<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle saisie - ANAC Archives DTA</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        #genForm input[type="text"],
        #genForm input[type="number"],
        #genForm select,
        #genForm textarea { text-transform: uppercase; }
        #genForm input[type="date"] { text-transform: none; }

        .empty-types {
            background: #FFF3E0;
            border: 1px solid #FFB74D;
            border-radius: 8px;
            padding: 16px;
            color: #E65100;
            font-size: 13px;
            text-align: center;
        }
        .empty-types a { color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <div class="topbar">
                <div>
                    <div class="page-title">Nouvelle saisie</div>
                </div>
            </div>

            <div class="content-wrapper" style="max-width:900px;">

                <div id="emptyTypesMsg" style="display:none;">
                    <div class="empty-types">
                        Aucun type d'autorisation configuré. <a href="types.html">Créer un type</a> avant de continuer.
                    </div>
                </div>

                <div class="section-card" id="formCard">
                    <form id="genForm">
                        <div class="form-grid" id="formFields"></div>

                        <div class="btn-row">
                            <button type="button" class="btn btn-secondary" id="btnPreview">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                Aperçu PDF
                            </button>
                            <button type="submit" class="btn btn-primary" id="btnSave" style="width:auto; padding:12px 28px;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                                <span id="btnSaveText">Enregistrer</span>
                            </button>
                        </div>
                    </form>
                </div>

                <div class="section-card" id="previewSection" style="display:none;">
                    <div class="section-title">Aperçu</div>
                    <iframe id="pdfPreview" style="width:100%; height:700px; border:1px solid var(--border); border-radius:8px;"></iframe>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { checkAuth, injectSidebar } from '../assets/js/layout.js';
        import { showToast, fromISODate } from '../assets/js/helpers.js';
        import { generateAuthorizationPDF, downloadGeneratedPDF, getPDFDataURI, getPDFBlob, clearModelsCache } from '../assets/js/pdf-gen.js';
        import { createAuthorization, getAllUsers } from '../assets/js/database.js';
        import { notifyDirectors } from '../assets/js/notification.js';
        import { db } from '../assets/js/firebase-config.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        injectSidebar('generator');

        let currentUserEmail = '';
        let TYPES = {};   // { SAT: { code, label, format }, ... }
        let CHAMPS = {};  // { idChamp: { id, name, type, options, required, scope, types } }

        checkAuth(async (user) => {
            currentUserEmail = user.email || '';
            await loadConfig();
            renderForm();
        });

        async function loadConfig() {
            try {
                const [tSnap, cSnap] = await Promise.all([
                    getDoc(doc(db, 'params', 'types')),
                    getDoc(doc(db, 'params', 'champs'))
                ]);
                TYPES = tSnap.exists() ? (tSnap.data().list || {}) : {};
                CHAMPS = cSnap.exists() ? (cSnap.data().list || {}) : {};
            } catch (e) {
                console.error(e);
                showToast('Erreur chargement: ' + e.message, 'error');
            }
        }

        function renderForm() {
            const codes = Object.keys(TYPES);
            if (codes.length === 0) {
                document.getElementById('emptyTypesMsg').style.display = 'block';
                document.getElementById('formCard').style.display = 'none';
                return;
            }

            // dropdown des types + bouton enregistrer
            let html = `
                <div class="form-group">
                    <label class="form-label">Type d'autorisation *</label>
                    <select id="fType" class="form-select" required>
                        <option value="">—</option>
                        ${codes.map(c => `<option value="${c}">${TYPES[c].code} — ${TYPES[c].label}</option>`).join('')}
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">N° Autorisation *</label>
                    <input type="text" id="fNumero" class="form-input" required>
                    <div style="font-size:11px; color:var(--text-muted); margin-top:4px;" id="numHint"></div>
                </div>
                <div class="form-group">
                    <label class="form-label">Date d'émission *</label>
                    <input type="date" id="fDateEmission" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Date de réception</label>
                    <input type="date" id="fDateReception" class="form-input">
                </div>
            `;

            // champs personnalisés (rendus selon le type sélectionné — pour l'instant on affiche les globaux)
            html += '<div id="customFields" class="form-grid" style="grid-column:1/-1; padding:0; gap:0;"></div>';

            document.getElementById('formFields').innerHTML = html;
            document.getElementById('fType').addEventListener('change', onTypeChange);
        }

        function onTypeChange() {
            const code = document.getElementById('fType').value;
            const t = TYPES[code];
            if (!t) {
                document.getElementById('numHint').textContent = '';
                document.getElementById('customFields').innerHTML = '';
                return;
            }
            // suggérer un numéro selon le format
            const example = generateNumExample(t.format);
            document.getElementById('numHint').textContent = `Format suggéré : ${example}`;
            // si le numéro est vide, le pré-remplir
            const numInput = document.getElementById('fNumero');
            if (!numInput.value) numInput.value = example;
            // afficher les champs personnalisés
            renderCustomFields(code);
        }

        function generateNumExample(format) {
            const yy = String(new Date().getFullYear()).slice(-2);
            const yyyy = String(new Date().getFullYear());
            return (format || '')
                .replace(/\{NUM:(\d+)\}/g, (_, n) => '1'.padStart(parseInt(n), '0'))
                .replace(/\{NUM\}/g, '1')
                .replace(/\{YY\}/g, yy)
                .replace(/\{YYYY\}/g, yyyy);
        }

        function renderCustomFields(typeCode) {
            // garder les champs visibles : globaux + ceux du type sélectionné
            const visible = Object.values(CHAMPS).filter(c =>
                c.scope === 'global' || (c.types || []).includes(typeCode)
            );

            const c = document.getElementById('customFields');
            if (visible.length === 0) {
                c.innerHTML = '';
                return;
            }
            c.innerHTML = visible.map(f => renderField(f)).join('');
        }

        function renderField(f) {
            const reqStar = f.required ? ' *' : '';
            const reqAttr = f.required ? 'required' : '';
            let input = '';
            switch (f.type) {
                case 'textarea':
                    input = `<textarea id="cf_${f.id}" class="form-input" rows="3" ${reqAttr}></textarea>`;
                    break;
                case 'number':
                    input = `<input type="number" id="cf_${f.id}" class="form-input" ${reqAttr}>`;
                    break;
                case 'date':
                    input = `<input type="date" id="cf_${f.id}" class="form-input" ${reqAttr}>`;
                    break;
                case 'select':
                    input = `<select id="cf_${f.id}" class="form-select" ${reqAttr}>
                        <option value="">—</option>
                        ${(f.options || []).map(o => `<option value="${o}">${o}</option>`).join('')}
                    </select>`;
                    break;
                default:
                    input = `<input type="text" id="cf_${f.id}" class="form-input" ${reqAttr}>`;
            }
            const fullClass = f.type === 'textarea' ? 'full' : '';
            return `<div class="form-group ${fullClass}"><label class="form-label">${f.name}${reqStar}</label>${input}</div>`;
        }

        function getFormData() {
            const code = document.getElementById('fType').value;
            const t = TYPES[code] || {};

            const data = {
                numero:        document.getElementById('fNumero').value.trim(),
                typeCode:      code,
                type:          t.label || '',
                dateEmission:  fromISODate(document.getElementById('fDateEmission').value),
                dateReception: fromISODate(document.getElementById('fDateReception').value),
            };

            // ajouter tous les champs personnalisés
            const visible = Object.values(CHAMPS).filter(c =>
                c.scope === 'global' || (c.types || []).includes(code)
            );
            for (const f of visible) {
                const el = document.getElementById('cf_' + f.id);
                if (!el) continue;
                let val = el.value.trim();
                if (f.type === 'date' && val) val = fromISODate(val);
                data[f.id] = val;
            }
            return data;
        }

        function validate() {
            const d = getFormData();
            if (!d.typeCode) { showToast('Sélectionnez un type', 'warning'); return null; }
            if (!d.numero) { showToast('N° Autorisation requis', 'warning'); return null; }
            if (!d.dateEmission) { showToast("Date d'émission requise", 'warning'); return null; }

            // valider les champs personnalisés obligatoires
            const visible = Object.values(CHAMPS).filter(c =>
                c.scope === 'global' || (c.types || []).includes(d.typeCode)
            );
            for (const f of visible) {
                if (f.required && !d[f.id]) {
                    showToast(`Champ requis : ${f.name}`, 'warning');
                    return null;
                }
            }
            return d;
        }

        // ─── APERÇU ────────────────────────────────────────────
        document.getElementById('btnPreview').addEventListener('click', async () => {
            const d = validate();
            if (!d) return;
            try {
                clearModelsCache(); // pour avoir la dernière version du modèle
                const uri = await getPDFDataURI(d);
                document.getElementById('pdfPreview').src = uri;
                document.getElementById('previewSection').style.display = 'block';
                document.getElementById('previewSection').scrollIntoView({ behavior: 'smooth' });
            } catch (e) {
                showToast('Erreur aperçu: ' + e.message, 'error');
            }
        });

        // ─── ENREGISTRER ───────────────────────────────────────
        document.getElementById('genForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const d = validate();
            if (!d) return;

            const btn = document.getElementById('btnSave');
            const btnText = document.getElementById('btnSaveText');
            btn.disabled = true;
            btnText.textContent = 'Enregistrement...';

            try {
                clearModelsCache();
                const pdfDoc = await generateAuthorizationPDF(d);
                const blob = await getPDFBlob(d, pdfDoc);
                const pdfFile = new File([blob], `${d.numero}.pdf`, { type: 'application/pdf' });

                await downloadGeneratedPDF(d, pdfDoc);
                await createAuthorization(d, pdfFile);
                showToast(`${d.numero} archivée — en attente d'approbation`, 'success');

                // notification email
                try {
                    const users = await getAllUsers();
                    const directors = users.filter(u => u.role === 'directeur' && u.email);
                    if (directors.length > 0) {
                        await notifyDirectors(directors, d, currentUserEmail);
                        showToast(`Email envoyé à ${directors.length} directeur(s)`, 'info');
                    }
                } catch (e) {
                    console.warn('Notification:', e.message);
                }

                document.getElementById('genForm').reset();
                document.getElementById('previewSection').style.display = 'none';
            } catch (err) {
                console.error(err);
                showToast('Erreur: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Enregistrer';
            }
        });
    </script>
</body>
</html>
