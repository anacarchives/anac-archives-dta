<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouvelle saisie - ANAC Archives DTA</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <style>
        #genForm input[type="text"],
        #genForm input[type="number"],
        #genForm select,
        #genForm textarea { text-transform: uppercase; }
        #genForm input[type="date"] { text-transform: none; }

        .empty-types {
            background: #FFF3E0;
            border: 1px solid #FFB74D;
            border-radius: 8px;
            padding: 16px;
            color: #E65100;
            font-size: 13px;
            text-align: center;
        }
        .empty-types a { color: var(--primary); font-weight: 600; }
    </style>
</head>
<body>
    <div class="app-container">
        <main class="main-content">
            <div class="topbar">
                <div>
                    <div class="page-title">Nouvelle saisie</div>
                </div>
            </div>

            <div class="content-wrapper" style="max-width:900px;">

                <div id="emptyTypesMsg" style="display:none;">
                    <div class="empty-types">
                        Aucun type d'autorisation configuré. <a href="types.html">Créer un type</a> avant de continuer.
                    </div>
                </div>

                <div class="section-card" id="formCard">
                    <form id="genForm">
                        <div class="form-grid" id="formFields"></div>

                        <div class="btn-row">
                            <button type="button" class="btn btn-secondary" id="btnPreview">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                                Aperçu PDF
                            </button>
                            <button type="submit" class="btn btn-primary" id="btnSave" style="width:auto; padding:12px 28px;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                                <span id="btnSaveText">Enregistrer</span>
                            </button>
                            <button type="button" class="btn btn-success" id="btnSaveApprove" style="display:none; width:auto; padding:12px 28px; background:#22C55E; color:white; border:none;">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                                Enregistrer et approuver
                            </button>
                        </div>
                    </form>
                </div>

                <div class="section-card" id="previewSection" style="display:none;">
                    <div class="section-title">Aperçu</div>
                    <iframe id="pdfPreview" style="width:100%; height:700px; border:1px solid var(--border); border-radius:8px;"></iframe>
                </div>
            </div>
        </main>
    </div>

    <script type="module">
        import { checkAuth, injectSidebar } from '../assets/js/layout.js';
        import { showToast, fromISODate } from '../assets/js/helpers.js';
        import { generateAuthorizationPDF, downloadGeneratedPDF, getPDFDataURI, getPDFBlob, clearModelsCache } from '../assets/js/pdf-gen2.js';
        import { createAuthorization, getAllUsers, approveAuthorization } from '../assets/js/database.js';
        import { notifyDirectors } from '../assets/js/notification.js';
        import { db } from '../assets/js/firebase-config.js';
        import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        injectSidebar('generator');

        let currentUserEmail = '';
        let currentAuthUser = null;
        let currentUserData = null;
        let TYPES = {};
        let CHAMPS = {};

        checkAuth(async (user, userData) => {
            currentAuthUser = user;
            currentUserData = userData;
            currentUserEmail = user.email || '';
            // si directeur, montrer le bouton "Enregistrer et approuver"
            if (userData.role === 'directeur') {
                const b = document.getElementById('btnSaveApprove');
                if (b) b.style.display = 'inline-flex';
            }
            await loadConfig();
            renderForm();
        });

        async function loadConfig() {
            try {
                const [tSnap, cSnap] = await Promise.all([
                    getDoc(doc(db, 'params', 'types')),
                    getDoc(doc(db, 'params', 'champs'))
                ]);
                TYPES = tSnap.exists() ? (tSnap.data().list || {}) : {};
                CHAMPS = cSnap.exists() ? (cSnap.data().list || {}) : {};
            } catch (e) {
                console.error(e);
                showToast('Erreur chargement: ' + e.message, 'error');
            }
        }

        function renderForm() {
            const codes = Object.keys(TYPES);
            if (codes.length === 0) {
                document.getElementById('emptyTypesMsg').style.display = 'block';
                document.getElementById('formCard').style.display = 'none';
                return;
            }

            // seul le Type d'autorisation est gardé en hardcodé (obligatoire pour choisir le modèle)
            let html = `
                <div class="form-group">
                    <label class="form-label">Type d'autorisation *</label>
                    <select id="fType" class="form-select" required>
                        <option value="">—</option>
                        ${codes.map(c => `<option value="${c}">${TYPES[c].code} — ${TYPES[c].label}</option>`).join('')}
                    </select>
                </div>
                <input type="hidden" id="fNumero">
            `;

            html += '<div id="customFields" class="form-grid" style="grid-column:1/-1; padding:0; gap:0;"></div>';

            document.getElementById('formFields').innerHTML = html;
            document.getElementById('fType').addEventListener('change', onTypeChange);
        }

        function onTypeChange() {
            const code = document.getElementById('fType').value;
            const t = TYPES[code];
            if (!t) {
                document.getElementById('customFields').innerHTML = '';
                return;
            }
            const example = generateNumExample(t.format);
            document.getElementById('fNumero').value = example;
            renderCustomFields(code);
            updateNumeroFields(code);
        }

        function generateNumExample(format) {
            const yy = String(new Date().getFullYear()).slice(-2);
            const yyyy = String(new Date().getFullYear());
            return (format || '')
                .replace(/\{NUM:(\d+)\}/g, (_, n) => '1'.padStart(parseInt(n), '0'))
                .replace(/\{NUM\}/g, '1')
                .replace(/\{YY\}/g, yy)
                .replace(/\{YYYY\}/g, yyyy);
        }

        function renderCustomFields(typeCode) {
            // garder les champs visibles : globaux + ceux du type sélectionné, triés par ordre
            // ON CACHE les champs dont l'identifiant ou le nom = "type" (déjà géré par le sélecteur système)
            const visible = Object.values(CHAMPS)
                .filter(c => c.scope === 'global' || (c.types || []).includes(typeCode))
                .filter(c => !isTypeField(c))
                .sort((a, b) => (a.order || 0) - (b.order || 0));

            const c = document.getElementById('customFields');
            if (visible.length === 0) {
                c.innerHTML = '';
                return;
            }
            c.innerHTML = visible.map(f => renderField(f)).join('');
        }

        // détecte si un champ correspond au "Type d'autorisation" (déjà géré par le sélecteur système)
        function isTypeField(f) {
            if (!f) return false;
            if (f.id === 'type' || f.id === 'typeCode') return true;
            if (f.name && f.name.trim().toLowerCase() === 'type') return true;
            return false;
        }

        function renderField(f) {
            const reqStar = f.required ? ' *' : '';
            const reqAttr = f.required ? 'required' : '';
            let input = '';
            const hasOptions = (f.options || []).length > 0;

            // détection : champ "numéro d'autorisation" — UNIQUEMENT par ID exact
            // (avant on détectait sur le nom mais ça causait des conflits avec "Numéro Passport" etc.)
            const isNumeroField = f.id === 'numero' || f.id === 'n';

            if (isNumeroField) {
                // champ verrouillé avec format depuis le type — seul le milieu modifiable
                input = `
                    <div class="numero-locked" data-id="${f.id}" style="display:flex; align-items:stretch; gap:0; border:1.5px solid var(--border); border-radius:8px; overflow:hidden; background:white;">
                        <span class="num-prefix" style="padding:10px 12px; background:#F5F5F5; color:var(--text-light); font-family:monospace; font-weight:700; border-right:1px solid var(--border-light);">—</span>
                        <input type="text" id="cf_${f.id}_num" class="num-middle" style="flex:1; border:none; padding:10px 12px; font-family:monospace; font-weight:700; text-align:center; outline:none; background:white; color:var(--primary); font-size:15px;" placeholder="000">
                        <span class="num-suffix" style="padding:10px 12px; background:#F5F5F5; color:var(--text-light); font-family:monospace; font-weight:700; border-left:1px solid var(--border-light);">—</span>
                        <input type="hidden" id="cf_${f.id}">
                    </div>
                    <div style="font-size:11px; color:var(--text-muted); margin-top:4px;" id="numero_hint_${f.id}">Sélectionnez d'abord un type d'autorisation</div>
                `;
            } else if (hasOptions && f.type !== 'date' && f.type !== 'number' && f.type !== 'textarea') {
                const opts = f.options || [];
                input = `
                    <div class="combo-wrap" data-id="${f.id}">
                        <select id="cf_${f.id}" class="form-select sel-mode" ${reqAttr}>
                            <option value="">—</option>
                            ${opts.map(o => `<option value="${o}">${o}</option>`).join('')}
                            <option value="__manual__">— Saisir manuellement —</option>
                        </select>
                        <input type="text" id="cf_man_${f.id}" class="form-input man-mode" style="display:none; margin-top:6px;">
                        <span class="toggle-link" data-id="${f.id}" style="font-size:11px; color:var(--primary); cursor:pointer; text-decoration:underline; margin-top:4px; display:inline-block;">Saisir manuellement</span>
                    </div>
                `;
            } else {
                switch (f.type) {
                    case 'textarea':
                        input = `<textarea id="cf_${f.id}" class="form-input" rows="3" ${reqAttr}></textarea>`;
                        break;
                    case 'number':
                        input = `<input type="number" id="cf_${f.id}" class="form-input" ${reqAttr}>`;
                        break;
                    case 'date':
                        input = `<input type="date" id="cf_${f.id}" class="form-input" ${reqAttr}>`;
                        break;
                    default:
                        input = `<input type="text" id="cf_${f.id}" class="form-input" ${reqAttr}>`;
                }
            }
            const fullClass = f.type === 'textarea' ? 'full' : '';
            return `<div class="form-group ${fullClass}"><label class="form-label">${f.name}${reqStar}</label>${input}</div>`;
        }

        // décompose un format ex "SAT-{NUM:3}-{YY}" en {prefix, suffix, numLength}
        function parseFormat(format) {
            const yy = String(new Date().getFullYear()).slice(-2);
            const yyyy = String(new Date().getFullYear());
            const filled = (format || '').replace(/\{YY\}/g, yy).replace(/\{YYYY\}/g, yyyy);
            const m = filled.match(/^(.*?)\{NUM(?::(\d+))?\}(.*?)$/);
            if (!m) return { prefix: filled, suffix: '', numLength: 3 };
            return { prefix: m[1], suffix: m[3], numLength: parseInt(m[2] || '3') };
        }

        // met à jour les champs numero verrouillés selon le type sélectionné
        function updateNumeroFields(typeCode) {
            const t = TYPES[typeCode];
            if (!t) return;
            const { prefix, suffix, numLength } = parseFormat(t.format);
            document.querySelectorAll('.numero-locked').forEach(box => {
                const id = box.dataset.id;
                box.querySelector('.num-prefix').textContent = prefix;
                box.querySelector('.num-suffix').textContent = suffix;
                const numInput = box.querySelector('.num-middle');
                numInput.maxLength = numLength;
                numInput.placeholder = '0'.repeat(numLength);
                // pré-remplir avec 001 si vide
                if (!numInput.value) numInput.value = '1'.padStart(numLength, '0');
                const hint = document.getElementById(`numero_hint_${id}`);
                if (hint) hint.textContent = `Format : ${prefix}${'0'.repeat(numLength)}${suffix}`;
                // mettre à jour le hidden input
                updateHiddenNumero(id, prefix, suffix);
                numInput.removeEventListener('input', numInput._handler);
                numInput._handler = () => updateHiddenNumero(id, prefix, suffix);
                numInput.addEventListener('input', numInput._handler);
            });
        }

        function updateHiddenNumero(id, prefix, suffix) {
            const numInput = document.querySelector(`.numero-locked[data-id="${id}"] .num-middle`);
            const hidden = document.getElementById('cf_' + id);
            if (numInput && hidden) {
                hidden.value = prefix + numInput.value + suffix;
            }
        }

        // gérer le toggle manuel/select pour les champs select
        document.addEventListener('click', (e) => {
            if (e.target.classList.contains('toggle-link')) {
                const id = e.target.dataset.id;
                const sel = document.getElementById('cf_' + id);
                const man = document.getElementById('cf_man_' + id);
                if (!sel || !man) return;
                const isManual = man.style.display !== 'none';
                if (isManual) {
                    man.style.display = 'none'; sel.style.display = '';
                    e.target.textContent = 'Saisir manuellement';
                } else {
                    sel.style.display = 'none'; man.style.display = '';
                    e.target.textContent = 'Choisir dans la liste';
                    man.focus();
                }
            }
        });

        document.addEventListener('change', (e) => {
            if (e.target.classList.contains('sel-mode') && e.target.value === '__manual__') {
                const id = e.target.id.replace('cf_', '');
                const sel = e.target;
                const man = document.getElementById('cf_man_' + id);
                const link = document.querySelector(`.toggle-link[data-id="${id}"]`);
                if (man) {
                    sel.style.display = 'none';
                    man.style.display = '';
                    if (link) link.textContent = 'Choisir dans la liste';
                    man.focus();
                }
            }
        });

        function getFormData() {
            const code = document.getElementById('fType').value;
            const t = TYPES[code] || {};

            const data = {
                numero:   document.getElementById('fNumero').value.trim(),
                typeCode: code,
                type:     t.label || '',
            };

            const visible = Object.values(CHAMPS)
                .filter(c => c.scope === 'global' || (c.types || []).includes(code))
                .sort((a, b) => (a.order || 0) - (b.order || 0));

            for (const f of visible) {
                // si c'est un champ "type", on injecte la valeur du sélecteur système
                if (isTypeField(f)) {
                    data[f.id] = t.label || '';
                    continue;
                }

                let val = '';
                const hasOptions = (f.options || []).length > 0;
                const isCombo = hasOptions && f.type !== 'date' && f.type !== 'number' && f.type !== 'textarea';
                const isNumeroField = f.id === 'numero' || f.id === 'n';

                if (isNumeroField) {
                    // lire depuis le hidden input ou recomposer depuis le champ verrouillé
                    const hidden = document.getElementById('cf_' + f.id);
                    val = hidden ? hidden.value.trim() : '';
                } else if (isCombo) {
                    const sel = document.getElementById('cf_' + f.id);
                    const man = document.getElementById('cf_man_' + f.id);
                    if (man && man.style.display !== 'none') {
                        val = man.value.trim();
                    } else if (sel) {
                        val = sel.value === '__manual__' ? '' : sel.value;
                    }
                } else {
                    const el = document.getElementById('cf_' + f.id);
                    if (!el) continue;
                    val = el.value.trim();
                    if (f.type === 'date' && val) val = fromISODate(val);
                }
                data[f.id] = val;
            }

            // si un champ personnalisé a id 'numero' ou 'n', sa valeur devient le numéro réel
            const numeroCustom = visible.find(f => f.id === 'numero' || f.id === 'n');
            if (numeroCustom && data[numeroCustom.id]) {
                data.numero = data[numeroCustom.id];
            }

            // idem pour date d'émission
            const dateEmCustom = visible.find(f =>
                f.id === 'dateEmission' ||
                (f.name && f.name.toLowerCase().includes('émission')) ||
                (f.name && f.name.toLowerCase().includes('emission'))
            );
            if (dateEmCustom && data[dateEmCustom.id]) {
                data.dateEmission = data[dateEmCustom.id];
            }

            return data;
        }

        function validate() {
            const d = getFormData();
            if (!d.typeCode) { showToast('Sélectionnez un type', 'warning'); return null; }

            const visible = Object.values(CHAMPS)
                .filter(c => c.scope === 'global' || (c.types || []).includes(d.typeCode))
                .filter(c => !isTypeField(c))
                .sort((a, b) => (a.order || 0) - (b.order || 0));

            for (const f of visible) {
                if (f.required && !d[f.id]) {
                    showToast(`Champ requis : ${f.name}`, 'warning');
                    return null;
                }
            }
            return d;
        }

        // ─── APERÇU ────────────────────────────────────────────
        document.getElementById('btnPreview').addEventListener('click', async () => {
            const d = validate();
            if (!d) return;
            try {
                clearModelsCache(); // pour avoir la dernière version du modèle
                const uri = await getPDFDataURI(d);
                document.getElementById('pdfPreview').src = uri;
                document.getElementById('previewSection').style.display = 'block';
                document.getElementById('previewSection').scrollIntoView({ behavior: 'smooth' });
            } catch (e) {
                showToast('Erreur aperçu: ' + e.message, 'error');
            }
        });

        // ─── ENREGISTRER ───────────────────────────────────────
        async function saveAuthorization(autoApprove = false) {
            const d = validate();
            if (!d) return;

            const btn = autoApprove ? document.getElementById('btnSaveApprove') : document.getElementById('btnSave');
            const btnText = document.getElementById('btnSaveText');
            btn.disabled = true;
            if (btnText && !autoApprove) btnText.textContent = 'Enregistrement...';
            if (autoApprove) btn.innerHTML = 'Enregistrement et approbation...';

            try {
                clearModelsCache();
                const pdfDoc = await generateAuthorizationPDF(d);
                const blob = await getPDFBlob(d, pdfDoc);
                const pdfFile = new File([blob], `${d.numero}.pdf`, { type: 'application/pdf' });

                await downloadGeneratedPDF(d, pdfDoc);
                const created = await createAuthorization(d, pdfFile);

                // si directeur et autoApprove, approuver immédiatement
                if (autoApprove && currentUserData?.role === 'directeur') {
                    try {
                        const sigKey = `signature_${currentAuthUser.uid}`;
                        const sig = localStorage.getItem(sigKey) || null;
                        await approveAuthorization(created.id, currentAuthUser.uid, currentUserEmail || currentUserData.identifiant || '', sig);
                        showToast(`${d.numero} archivée et approuvée`, 'success');
                    } catch (e) {
                        showToast('Archivée mais erreur approbation: ' + e.message, 'warning');
                    }
                } else {
                    showToast(`${d.numero} archivée — en attente d'approbation`, 'success');

                    // notifier les directeurs (sauf si c'est le directeur lui-même qui crée)
                    if (currentUserData?.role !== 'directeur') {
                        try {
                            const users = await getAllUsers();
                            const directors = users.filter(u => u.role === 'directeur' && u.email);
                            if (directors.length > 0) {
                                await notifyDirectors(directors, d, currentUserEmail);
                                showToast(`Email envoyé à ${directors.length} directeur(s)`, 'info');
                            }
                        } catch (e) {
                            console.warn('Notification:', e.message);
                        }
                    }
                }

                document.getElementById('genForm').reset();
                document.getElementById('previewSection').style.display = 'none';

                // rediriger vers la liste après 1.5s
                setTimeout(() => {
                    window.location.href = 'liste.html';
                }, 1500);
            } catch (err) {
                console.error(err);
                showToast('Erreur: ' + err.message, 'error');
            } finally {
                btn.disabled = false;
                if (btnText && !autoApprove) btnText.textContent = 'Enregistrer';
                if (autoApprove) {
                    btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Enregistrer et approuver`;
                }
            }
        }

        document.getElementById('genForm').addEventListener('submit', (e) => {
            e.preventDefault();
            saveAuthorization(false);
        });

        document.getElementById('btnSaveApprove').addEventListener('click', () => {
            if (!confirm("Enregistrer ET approuver l'autorisation ?")) return;
            saveAuthorization(true);
        });
    </script>
</body>
</html>
