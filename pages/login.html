<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - ANAC Archives DTA</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-header">
            <div class="logo-circle">
                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </div>
            <h1>ANAC Archives DTA</h1>
            <p>Direction du Transport Aérien</p>
        </div>

        <div class="login-body">
            <div class="form-group">
                <label class="form-label">Email ou identifiant</label>
                <input type="text" id="loginInput" class="form-input" placeholder="Email ou identifiant" autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label">Mot de passe</label>
                <input type="password" id="loginPassword" class="form-input" placeholder="Mot de passe" autocomplete="current-password">
            </div>

            <div id="errorMessage" class="error-message"></div>

            <button class="btn btn-primary" id="loginBtn" style="width:100%;">
                <span id="btnText">Se connecter</span>
            </button>

            <p class="login-footer">Accès réservé au personnel autorisé de l'ANAC</p>
        </div>
    </div>

    <script type="module">
        import { auth, db } from '../assets/js/firebase-config.js';
        import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // si déjà connecté, on saute la page login
        onAuthStateChanged(auth, (user) => {
            if (user) window.location.href = 'dashboard.html';
        });

        const loginBtn  = document.getElementById('loginBtn');
        const btnText   = document.getElementById('btnText');
        const errorMsg  = document.getElementById('errorMessage');

        document.getElementById('loginPassword').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });

        loginBtn.addEventListener('click', async () => {
            const input    = document.getElementById('loginInput').value.trim();
            const password = document.getElementById('loginPassword').value;

            if (!input || !password) {
                showError('Veuillez remplir tous les champs');
                return;
            }

            loginBtn.disabled = true;
            btnText.textContent = 'Connexion...';
            errorMsg.classList.remove('show');

            // détecte si c'est un email (contient @) ou un identifiant directeur
            const isEmail = input.includes('@');

            try {
                if (isEmail) {
                    // connexion normale Firebase Auth (admin / agent)
                    await signInWithEmailAndPassword(auth, input, password);
                    window.location.href = 'dashboard.html';
                } else {
                    // connexion directeur via identifiant stocké dans Firestore
                    await loginWithIdentifiant(input, password);
                }
            } catch (err) {
                loginBtn.disabled = false;
                btnText.textContent = 'Se connecter';
                showError(translateError(err.code || err.message));
            }
        });

        async function loginWithIdentifiant(identifiant, password) {
            // on construit l'email Firebase directement depuis l'identifiant
            // sans passer par Firestore (qui nécessite d'être auth)
            // on essaie les deux formats possibles
            const formats = [
                `${identifiant.toLowerCase()}@dta.anacarchives.internal`,
                `${identifiant.toLowerCase()}@directeur.anacarchives.dta`
            ];

            let lastError = null;
            for (const firebaseEmail of formats) {
                try {
                    await signInWithEmailAndPassword(auth, firebaseEmail, password);
                    window.location.href = 'dashboard.html';
                    return;
                } catch (e) {
                    lastError = e;
                }
            }
            // si les deux ont échoué
            throw { code: 'auth/invalid-credential', message: 'Identifiant ou mot de passe incorrect' };
        }

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add('show');
        }

        function translateError(code) {
            const map = {
                'auth/invalid-credential':     'Identifiant ou mot de passe incorrect',
                'auth/wrong-password':          'Identifiant ou mot de passe incorrect',
                'auth/user-not-found':          'Identifiant ou mot de passe incorrect',
                'auth/invalid-email':           'Format d\'email invalide',
                'auth/too-many-requests':       'Trop de tentatives. Réessayez plus tard.',
                'auth/network-request-failed':  'Problème de connexion internet',
            };
            return map[code] || code || 'Erreur de connexion';
        }
    </script>
</body>
</html>
